name: Mirror to Codeberg
on: [push, delete, workflow_dispatch]

concurrency:
  group: codeberg-mirror

env:
  REPO: .profile

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: NECOtype/mirror-action@master
        with:
          REMOTE: "ssh://git@codeberg.org/NECOdes/${{ env.REPO }}.git"
          GIT_SSH_PRIVATE_KEY: ${{ secrets.CODEBERG_SSH_PRIVATE_KEY }}
          GIT_SSH_KNOWN_HOSTS: ${{ secrets.CODEBERG_SSH_KNOWN_HOSTS }}
